[package]
name = "kioku"
version = "0.3.0-beta.8"
edition = "2021"
description = "Kioku: a personal second brain kept by your AI agents"
license = "GPL-3.0-only"
repository = "https://github.com/Drum3X/kioku"
rust-version = "1.82"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ignore = "0.4"
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
unicode-normalization = "0.1"
walkdir = "2"
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
rpassword = "7"
tiny_http = "0.12"
# Hybrid search with the e5 model. Built in with ONNX Runtime linked in (semantic-bundled: the
# release binaries, install.sh) or loaded at run time (semantic-dynamic: the Nix package, which
# bakes in nixpkgs' library). Search itself stays off until `kioku semantic on`.
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std"], optional = true }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"], optional = true }

[features]
default = []
semantic = ["dep:ort", "dep:tokenizers"]
semantic-bundled = ["semantic", "ort/download-binaries"]
semantic-dynamic = ["semantic", "ort/load-dynamic"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
