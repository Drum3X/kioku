name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - name: Smoke test (fixture vault, install, hooks, commit)
        shell: bash
        env:
          KIOKU_NO_MODEL: "1"
        run: bash tests/smoke.sh
      - name: Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - name: Build with hybrid search (ONNX Runtime linked in)
        run: cargo build --release --locked --features semantic-bundled
